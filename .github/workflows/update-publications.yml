name: Update publications from ORCID

on:
  schedule:
    - cron: "17 13 * * 1"  # every Monday, 13:17 UTC
  workflow_dispatch:       # also lets you run it by hand from the Actions tab

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch publications
        run: python3 scripts/update_publications.py

      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/publications_auto.json; then
            echo "No new publications."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications_auto.json
          git commit -m "Update publications from ORCID"
          git push
          # Pushes made by this workflow don't start other workflows on their own,
          # so start the site deployment explicitly.
          gh workflow run hugo.yaml --ref "${GITHUB_REF_NAME}"
