{{- $icons := dict
  "eye" `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
  "people" `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`
  "spark" `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>`
-}}
<div class="research-cards">
  {{- range site.Data.research }}
  <a class="research-card" href="{{ .link }}">
    <span class="research-card-icon">{{ index $icons .icon | default (index $icons "spark") | safeHTML }}</span>
    <span class="research-card-title">{{ .title }}</span>
    <span class="research-card-summary">{{ .summary }}</span>
    <span class="research-card-more">Read more →</span>
  </a>
  {{- end }}
</div>
